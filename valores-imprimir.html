<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MAPTORK - Imprimir valores</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f3f5f8;color:#151515;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:12px;background:#ffffff;border-bottom:1px solid #dbe2ea;box-shadow:0 4px 14px rgba(35,43,53,.05)}.toolbar button{height:42px;padding:0 18px;border-radius:11px;font-weight:800;border:1px solid #d6dce5;background:#f6f8fb;color:#273249}.toolbar .primary{background:linear-gradient(180deg,#52c4f7,#2ea7ea);border-color:#71cdf5;color:#fff;box-shadow:0 8px 18px rgba(46,167,234,.22)}.toolbar .primary:hover{filter:brightness(1.04)}.paper{width:min(760px,calc(100% - 24px));margin:18px auto;background:#fff;min-height:900px;padding:32px;box-shadow:0 5px 25px rgba(0,0,0,.08)}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #2b9fdb;padding-bottom:13px;margin-bottom:22px}.brand{font-size:23px;font-weight:900}.sub{font-size:11px;color:#777;margin-top:4px}.date{font-size:11px;color:#666}.footer-brand{margin-top:8px;font-size:9px;color:#999;text-align:center}.footer-brand strong{font-size:10px;color:#777}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f2f2f2;text-align:left;padding:10px;border:1px solid #d7d7d7;text-transform:uppercase;font-size:10px}td{padding:11px 10px;border:1px solid #dedede}.num{width:42px;text-align:center;color:#777}.money{width:140px;text-align:right;font-weight:700}.total{margin-top:16px;margin-left:auto;width:270px;display:flex;justify-content:space-between;padding:14px 16px;border:2px solid #222;font-size:15px}.total strong{font-size:18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;margin:0 0 18px;padding:13px 15px;border:1px solid #dedede;background:#fafafa;font-size:11px;color:#333}.meta .wide{grid-column:1/-1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.meta b{font-weight:800}.footer{margin-top:34px;border-top:1px solid #ddd;padding-top:10px;font-size:10px;color:#777;text-align:center}.erro{padding:30px;text-align:center;color:#b00020}
@media(max-width:600px){.paper{width:100%;margin:0;box-shadow:none;padding:18px}.toolbar{padding:9px}.toolbar button{flex:1;padding:0 8px;font-size:12px}.top{align-items:flex-start}.total{width:100%}}
@media print{body{background:#fff}.toolbar{display:none}.paper{width:100%;margin:0;box-shadow:none;padding:12mm;min-height:0}@page{size:A4;margin:8mm}}
.toolbar .page-corner-close{position:absolute;right:12px;top:12px;width:42px;padding:0;border:0;border-radius:50%;background:transparent;font-size:32px;line-height:1;font-weight:300;color:#4f5d70}.toolbar .page-corner-close:hover{background:#eef4f8}
</style>
</head>
<body>
<div class="toolbar"><button class="page-corner-close" onclick="voltarPagina()" aria-label="Fechar">×</button><button class="primary" onclick="imprimirOuSalvarPdf()">Imprimir / Salvar PDF</button></div>
<main id="paper" class="paper"></main>
<script>
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(t){return String(t||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
function imprimirOuSalvarPdf(){
 try{
  if(window.AndroidApp && typeof window.AndroidApp.printPage==='function'){
   window.AndroidApp.printPage();
   return;
  }
 }catch(e){console.warn('Impressão Android indisponível:',e)}
 window.print();
}
function voltarPagina(){
 try{
  if(window.AndroidApp && typeof window.AndroidApp.closeInternalPage==='function'){
   window.AndroidApp.closeInternalPage();
   return;
  }
 }catch(e){console.warn('Fechamento Android indisponível:',e)}
 try{ if(window.opener){ window.close(); return; } }catch(e){}
 try{ sessionStorage.setItem('maptork_calculadora_valores_reabrir','1'); }catch(e){}
 if(history.length>1){ history.back(); } else { location.href='index.html'; }
}
try{
 const raw=location.hash.slice(1);
 if(!raw){ location.replace('index.html'); throw new Error('MAPTORK_REDIRECT_HOME'); }
 const d=JSON.parse(decodeURIComponent(raw));
 if(!d || !Array.isArray(d.itens) || !d.itens.length){ location.replace('index.html'); throw new Error('MAPTORK_REDIRECT_HOME'); }
 const rows=(d.itens||[]).map((it,i)=>`<tr><td class="num">${i+1}</td><td>${esc(it.descricao)}</td><td class="money">${moeda(it.valor)}</td></tr>`).join('');
 const meta=(d.vendedor||d.clienteNome||d.clienteTelefone||d.clienteObs)?`<div class="meta">${d.vendedor?`<div><b>Vendedor:</b> ${esc(d.vendedor)}</div>`:''}${d.clienteNome?`<div><b>Cliente:</b> ${esc(d.clienteNome)}</div>`:''}${d.clienteTelefone?`<div><b>Telefone:</b> ${esc(d.clienteTelefone)}</div>`:''}${d.clienteObs?`<div class="wide"><b>Observação:</b> ${esc(d.clienteObs)}</div>`:''}</div>`:''; document.getElementById('paper').innerHTML=`<div class="top"><div><div class="brand">${esc(d.loja||'Orçamento')}</div><div class="sub">Orçamento / Serviços</div></div><div class="date">Data: ${esc(d.data||'')}</div></div>${meta}<table><thead><tr><th>#</th><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><span>TOTAL</span><strong>${moeda(d.total)}</strong></div><div class="footer">Documento gerado pela ferramenta MAPTORK</div><div class="footer-brand"><strong>MAPTORK</strong> · Calculadora de Valores</div>`;
 setTimeout(()=>imprimirOuSalvarPdf(),650);
}catch(e){if(e && e.message==='MAPTORK_REDIRECT_HOME'){}else{location.replace('index.html')}}
</script>
</body></html>
