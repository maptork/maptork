<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<script>
(function(){
  try { localStorage.setItem("maptork_tema", "light"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", "light");
})();
</script>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <img src="img/logo.png" class="logo">

    <h4>MAP<span>TORK</span></h4>
    <p>Crie sua conta</p>

    <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" maxlength="100" required>

    <input type="email" id="email" placeholder="E-mail" inputmode="email" autocomplete="email" required>

  <div class="senha-box">
    <input type="password" id="senha" placeholder="Senha">

</div>

<div class="senha-box">
    <input type="password" id="confirmarSenha" placeholder="Confirmar senha">

</div>

<button onclick="cadastrar()">
    CADASTRAR
</button>

<button class="cadastro-btn" type="button" onclick="window.location.href='login.html'">
    JÁ TENHO CONTA
</button>

<div id="mensagem" class="mensagem"></div>



    <button class="auth-corner-close" type="button" onclick="window.location.href='index.html'" aria-label="Fechar">×</button>

</div>

<script src="cadastro.js"></script>

</body>
</html>
