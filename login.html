<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • MAPTORK</title>

<script>
(function(){
  try { localStorage.setItem("maptork_tema", "light"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", "light");
})();
</script>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <button class="auth-corner-close" type="button" onclick="window.location.href='index.html'" aria-label="Fechar">×</button>

    <img src="img/logo.png" class="logo" alt="MAPTORK">

    <h4>MAP<span>TORK</span></h4>
    <p>Área exclusiva para membros.</p>

<form onsubmit="login(); return false;">

 <input type="email" id="email" placeholder="E-mail" required>

<div class="senha-box">
    <input type="password" id="senha" placeholder="Senha" required>
</div>

    <button type="submit">
        ENTRAR
    </button>
    <button
    class="cadastro-btn"
    type="button"
    onclick="window.location.href='cadastro.html'">
    CRIAR CONTA
</button>

</form>
<div id="mensagem" class="mensagem"></div>

<script src="login.js"></script>

   <a href="#" onclick="recuperarSenha(); return false;">
    Esqueci minha senha
</a>


</div>

</body>
</html>
